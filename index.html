<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abbreviation Learning Tool</title>
<style>
    body { 
        font-family: 'Segoe UI', Tahoma, sans-serif; 
        background: #0D1117;  /* dark background */
        padding: 30px; 
        color: #E4E4E4; /* default text for body */
    }
    h1, h2 { 
        color: #D87B66; /* warm heading color */
    }
    h1 { 
        text-align: center; 
        margin-bottom: 25px; 
        font-size: 2.2rem; 
    }
    h2 {
        margin-top: 25px;
        font-size: 1.2rem;
        font-weight: normal;
        opacity: 0.9;
    }
    .container { 
        max-width: 900px; 
        margin: auto; 
        background: #161B22; /* slightly lighter than background */
        padding: 25px; 
        border-radius: 12px; 
        box-shadow: 0 6px 25px rgba(0,0,0,0.6); 
    }
    textarea { 
        width: 100%; 
        height: 120px; 
        margin-bottom: 20px; 
        padding: 12px; 
        font-family: 'Consolas', monospace; 
        font-size: 1rem; 
        border: none; 
        border-radius: 8px; 
        outline: none; 
        background: #0D1117; 
        color: #E4E4E4; 
    }
    textarea:focus { 
        background: #161B22;
    }
    .btn { 
        padding: 12px 18px; 
        cursor: pointer; 
        background: #D87B66;  /* same as headings */
        color: #0D1117; 
        font-weight: bold;
        border: none; 
        border-radius: 6px; 
        margin-bottom: 20px; 
        font-size: 1rem;
        transition: background 0.3s ease; 
    }
    .btn:hover { 
        background: #B45A50; /* darker on hover */
    }
    .abbreviation-text { 
        display: flex; 
        flex-direction: column; 
        gap: 18px; 
    }
    .line { 
        cursor: pointer; 
        transition: all 0.3s ease; 
        padding: 6px 0;
    }
    .line:hover .abbr-line { 
        text-decoration: underline;
        text-decoration-color: #7EE778; /* underline in same as abbreviation */
    }
    .abbr-line { 
        font-family: 'Consolas', monospace; 
        font-weight: bold; 
        color: #7EE778; /* pastel green abbreviation */
        font-size: 1.4rem; 
    }
    .full-form-line { 
        font-family: 'Consolas', monospace; 
        color: #45B2FF; /* bright blue full form */
        display: none; 
        margin-top: 6px; 
        padding-left: 16px;
        border-left: 2px solid #45B2FF;
        animation: fadeIn 0.3s ease;
        font-size: 1.2rem; 
    }
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-3px); }
        to { opacity: 1; transform: translateY(0); }
    }
</style>
</head>
<body>
<div class="container">
    <h1>Abbreviation Learning Tool</h1>

    <h2>Abbreviations Input</h2>
    <textarea id="abbrInput" placeholder="Enter abbreviation lines, one line per sentence..."></textarea>

    <h2>Full Forms Input</h2>
    <textarea id="fullInput" placeholder="Enter corresponding full forms, one line per sentence..."></textarea>

    <button class="btn" id="generateBtn">Generate Tool</button>

    <h2>Abbreviated Text</h2>
    <div class="abbreviation-text" id="abbreviationText"></div>
</div>

<script>
// Encode text to URL-friendly format
function encodeForURL(text) {
    return encodeURIComponent(text);
}

// Decode text from URL
function decodeFromURL(text) {
    return decodeURIComponent(text || '');
}

// Preload from URL if available
window.addEventListener('DOMContentLoaded', () => {
    const params = new URLSearchParams(window.location.search);
    const abbrParam = params.get('abbr');
    const fullParam = params.get('full');
    if (abbrParam) document.getElementById('abbrInput').value = decodeFromURL(abbrParam);
    if (fullParam) document.getElementById('fullInput').value = decodeFromURL(fullParam);
});

// Generate abbreviation tool
document.getElementById('generateBtn').addEventListener('click', () => {
    const abbrText = document.getElementById('abbrInput').value.trim();
    const fullText = document.getElementById('fullInput').value.trim();
    const abbrLines = abbrText.split('\n');
    const fullLines = fullText.split('\n');

    if (abbrLines.length !== fullLines.length) {
        alert("Number of abbreviation lines and full form lines must match!");
        return;
    }

    // Update URL so it can be shared
    const newURL = `${window.location.origin}${window.location.pathname}?abbr=${encodeForURL(abbrText)}&full=${encodeForURL(fullText)}`;
    window.history.replaceState(null, '', newURL);

    const abbreviationText = document.getElementById('abbreviationText');
    abbreviationText.innerHTML = '';

    abbrLines.forEach((line, index) => {
        const lineDiv = document.createElement('div');
        lineDiv.className = 'line';

        // Always visible abbreviation
        const abbrSpan = document.createElement('span');
        abbrSpan.className = 'abbr-line';
        abbrSpan.textContent = line;

        // Full form hidden initially
        const fullSpan = document.createElement('span');
        fullSpan.className = 'full-form-line';
        fullSpan.textContent = fullLines[index];

        lineDiv.appendChild(abbrSpan);
        lineDiv.appendChild(fullSpan);

        // Toggle full form visibility (single line)
        lineDiv.addEventListener('click', () => {
            const isVisible = window.getComputedStyle(fullSpan).display !== 'none';
            fullSpan.style.display = isVisible ? 'none' : 'block';
        });

        abbreviationText.appendChild(lineDiv);
    });
});

// Keyboard shortcut: Press Ctrl + 1 to toggle all full forms
document.addEventListener('keydown', (event) => {
    if (event.ctrlKey && event.key === "1") {
        event.preventDefault(); // stop browser default zoom
        const allFullForms = document.querySelectorAll('.full-form-line');
        const anyHidden = Array.from(allFullForms).some(el => window.getComputedStyle(el).display === 'none');

        allFullForms.forEach(el => {
            el.style.display = anyHidden ? 'block' : 'none';
        });
    }
});
</script>
</body>
</html>
