<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abbreviation Learning Tool</title>
<style>
    body { 
        font-family: 'Segoe UI', Tahoma, sans-serif; 
        background: #0D1117;
        padding: 30px; 
        color: #E4E4E4;
    }
    h1, h2 { 
        color: #D87B66;
    }
    h1 { 
        text-align: center; 
        margin-bottom: 25px; 
        font-size: 2.2rem; 
    }
    h2 {
        margin-top: 25px;
        font-size: 1.2rem;
        font-weight: normal;
        opacity: 0.9;
    }
    .container { 
        max-width: 900px; 
        margin: auto; 
        background: #161B22;
        padding: 25px; 
        border-radius: 12px; 
        box-shadow: 0 6px 25px rgba(0,0,0,0.6); 
    }
    textarea { 
        width: 100%; 
        height: 120px; 
        margin-bottom: 20px; 
        padding: 12px; 
        font-family: 'Consolas', monospace; 
        font-size: 1rem; 
        border: none; 
        border-radius: 8px; 
        outline: none; 
        background: #0D1117; 
        color: #E4E4E4; 
    }
    textarea:focus { 
        background: #161B22;
    }
    .btn { 
        padding: 12px 18px; 
        cursor: pointer; 
        background: #D87B66;
        color: #0D1117; 
        font-weight: bold;
        border: none; 
        border-radius: 6px; 
        margin-bottom: 20px; 
        font-size: 1rem;
        transition: background 0.3s ease; 
    }
    .btn:hover { 
        background: #B45A50;
    }
    .abbreviation-text { 
        display: flex; 
        flex-direction: column; 
        gap: 18px; 
    }
    .line { 
        cursor: pointer; 
        transition: all 0.3s ease; 
        padding: 6px 0;
    }
    .line:hover .abbr-line { 
        text-decoration: underline;
        text-decoration-color: #7EE778;
    }
    .abbr-line { 
        font-family: 'Consolas', monospace; 
        font-weight: bold; 
        color: #7EE778; 
        font-size: 1.4rem; 
    }
    .full-form-line { 
        font-family: 'Consolas', monospace; 
        color: #45B2FF;
        display: none; 
        margin-top: 6px; 
        padding-left: 16px;
        border-left: 2px solid #45B2FF;
        animation: fadeIn 0.3s ease;
        font-size: 1.2rem; 
        white-space: pre-wrap; /* <-- preserves indentation and line breaks */
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-3px); }
        to { opacity: 1; transform: translateY(0); }
    }
</style>
</head>
<body>
<div class="container">
    <h1>Abbreviation Learning Tool</h1>

    <h2>Abbreviations Input</h2>
    <textarea id="abbrInput" placeholder="Enter abbreviation lines, one line per sentence..."></textarea>

    <h2>Full Forms Input</h2>
    <textarea id="fullInput" placeholder="Enter corresponding full forms, one line per sentence..."></textarea>

    <button class="btn" id="generateBtn">Generate Tool</button>

    <h2>Abbreviated Text</h2>
    <div class="abbreviation-text" id="abbreviationText"></div>

    <h2>Study Count: <span id="studyCount">0</span></h2>
    <button class="btn" id="countPlus">Studied +1</button>
    <button class="btn" id="countMinus">Studied -1</button>

</div>

<script>
function encodeForURL(text) {
    return encodeURIComponent(text);
}
function decodeFromURL(text) {
    return decodeURIComponent(text || '');
}

let isGenerated = false;
let currentIndex = 0;
let studyCount = 0;

// Load saved settings from URL
window.addEventListener('DOMContentLoaded', () => {
    const params = new URLSearchParams(window.location.search);
    const abbrParam = params.get('abbr');
    const fullParam = params.get('full');
    const countParam = params.get('count');

    if (abbrParam) document.getElementById('abbrInput').value = decodeFromURL(abbrParam);
    if (fullParam) document.getElementById('fullInput').value = decodeFromURL(fullParam);

    if (countParam) {
        studyCount = parseInt(countParam) || 0;
        document.getElementById('studyCount').textContent = studyCount;
    }
});

function updateURL() {
    const abbrText = document.getElementById('abbrInput').value.trim();
    const fullText = document.getElementById('fullInput').value.trim();

    const newURL = `${window.location.origin}${window.location.pathname}?abbr=${encodeForURL(abbrText)}&full=${encodeForURL(fullText)}&count=${studyCount}`;
    window.history.replaceState(null, '', newURL);
}

function generateTool() {
    const abbrText = document.getElementById('abbrInput').value.trim();
    const fullText = document.getElementById('fullInput').value.trim();
    const abbrLines = abbrText.split('\n');
    const fullLines = fullText.split('\n');

    if (abbrLines.length !== fullLines.length) {
        alert("Number of abbreviation lines and full form lines must match!");
        return;
    }

    updateURL();
    const container = document.getElementById('abbreviationText');
    container.innerHTML = '';

    abbrLines.forEach((line, index) => {
        const lineDiv = document.createElement('div');
        lineDiv.className = 'line';

        const abbrSpan = document.createElement('span');
        abbrSpan.className = 'abbr-line';
        abbrSpan.textContent = line;

        const fullSpan = document.createElement('span');
        fullSpan.className = 'full-form-line';
        fullSpan.textContent = fullLines[index];

        lineDiv.appendChild(abbrSpan);
        lineDiv.appendChild(fullSpan);

        lineDiv.addEventListener('click', () => {
            const visible = window.getComputedStyle(fullSpan).display !== 'none';
            fullSpan.style.display = visible ? 'none' : 'block';
        });

        container.appendChild(lineDiv);
    });

    isGenerated = true;
    currentIndex = 0;
}

document.getElementById('generateBtn').addEventListener('click', generateTool);

// +1 button
document.getElementById('countPlus').addEventListener('click', () => {
    studyCount++;
    document.getElementById('studyCount').textContent = studyCount;
    updateURL();
});

// -1 button (never below 0)
document.getElementById('countMinus').addEventListener('click', () => {
    if (studyCount > 0) {
        studyCount--;
        document.getElementById('studyCount').textContent = studyCount;
        updateURL();
    }
});

// SPACEBAR reveals next line
document.addEventListener('keydown', (event) => {
    if (event.key === ' ' && event.target.tagName !== 'TEXTAREA') {
        event.preventDefault();

        if (!isGenerated) {
            generateTool();
        } else {
            const allFullForms = document.querySelectorAll('.full-form-line');
            if (currentIndex < allFullForms.length) {
                allFullForms[currentIndex].style.display = 'block';
                currentIndex++;
            }
        }
    }
});

// CTRL+1 toggles full forms
document.addEventListener('keydown', (event) => {
    if (event.ctrlKey && event.key === "1") {
        event.preventDefault();

        const selection = window.getSelection();
        if (selection.rangeCount === 0 || selection.isCollapsed) {
            // No selection → toggle all as before
            const allFullForms = document.querySelectorAll('.full-form-line');
            const anyHidden = Array.from(allFullForms).some(el => window.getComputedStyle(el).display === 'none');
            allFullForms.forEach(el => el.style.display = anyHidden ? 'block' : 'none');
        } else {
            // There is a selection → toggle only the selected paragraph(s)
            const range = selection.getRangeAt(0);
            const selectedNodes = getNodesInRange(range);

            // Find all line divs within the selection
            const linesToToggle = selectedNodes.filter(node => node.classList && node.classList.contains('line'));

            linesToToggle.forEach(line => {
                const fullSpan = line.querySelector('.full-form-line');
                if (fullSpan) {
                    const visible = window.getComputedStyle(fullSpan).display !== 'none';
                    fullSpan.style.display = visible ? 'none' : 'block';
                }
            });
        }
    }
});

// Helper: get all nodes in a selection range
function getNodesInRange(range) {
    const nodes = [];
    const treeWalker = document.createTreeWalker(
        range.commonAncestorContainer,
        NodeFilter.SHOW_ELEMENT,
        {
            acceptNode: function(node) {
                return NodeFilter.FILTER_ACCEPT;
            }
        }
    );

    let currentNode = treeWalker.currentNode;
    while(currentNode) {
        if (range.intersectsNode(currentNode)) {
            nodes.push(currentNode);
        }
        currentNode = treeWalker.nextNode();
    }
    return nodes;
}
</script>
</body>
</html>
