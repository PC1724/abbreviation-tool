<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abbreviation Learning Tool</title>

<style>
body { 
    font-family: 'Segoe UI', Tahoma, sans-serif; 
    background: #0D1117;
    padding: 30px; 
    color: #E4E4E4;
}
h1, h2 { color: #D87B66; }
h1 { text-align: center; margin-bottom: 25px; font-size: 2.2rem; }
h2 { margin-top: 25px; font-size: 1.2rem; font-weight: normal; opacity: 0.9; }

.container { 
    max-width: 900px; 
    margin: auto; 
    background: #161B22;
    padding: 25px; 
    border-radius: 12px; 
    box-shadow: 0 6px 25px rgba(0,0,0,0.6); 
}

textarea { 
    width: 100%; 
    height: 120px; 
    margin-bottom: 20px; 
    padding: 12px; 
    font-family: 'Consolas', monospace; 
    font-size: 1rem; 
    border: none; 
    border-radius: 8px; 
    outline: none; 
    background: #0D1117; 
    color: #E4E4E4;
    white-space: pre-wrap;
}
textarea:focus { background: #161B22; }

.btn { 
    padding: 12px 18px; 
    cursor: pointer; 
    background: #D87B66;
    color: #0D1117; 
    font-weight: bold;
    border: none; 
    border-radius: 6px; 
    margin-bottom: 20px; 
    font-size: 1rem;
}
.btn:hover { background: #B45A50; }

.abbreviation-text { 
    display: flex; 
    flex-direction: column; 
    gap: 18px; 
}

.line { 
    cursor: pointer; 
    white-space: pre-wrap; 
}

.abbr-line { 
    font-family: 'Consolas', monospace; 
    font-weight: bold; 
    color: #7EE778; 
    font-size: 1.4rem; 
}

/* ===== FULL FORM (SOFT, CLEAN) ===== */
.full-form-line {
    font-family: 'Consolas', monospace;
    color: #45B2FF;

    max-height: 0;
    opacity: 0;
    overflow: hidden;

    margin-top: 4px;   /* sirf vertical gap */

    font-size: 1.1rem;

    transition:
        max-height 280ms ease,
        opacity 220ms ease;
}


.full-form-line.show {
    max-height: 200px;
    opacity: 0.85;
}

.full-form-line[data-empty="true"] {
    max-height: 1rem;
    opacity: 0;
}
</style>
</head>

<body>
<div class="container">
    <h1>Abbreviation Learning Tool</h1>

    <h2>Abbreviations Input</h2>
    <textarea id="abbrInput"></textarea>

    <h2>Full Forms Input</h2>
    <textarea id="fullInput"></textarea>

    <button class="btn" id="generateBtn">Generate Tool</button>

    <h2>Abbreviated Text</h2>
    <div class="abbreviation-text" id="abbreviationText"></div>

    <h2>Study Count: <span id="studyCount">0</span></h2>
    <button class="btn" id="countPlus">Studied +1</button>
    <button class="btn" id="countMinus">Studied -1</button>
</div>

<script>
const abbrInput = document.getElementById('abbrInput');
const fullInput = document.getElementById('fullInput');
const abbreviationText = document.getElementById('abbreviationText');
const generateBtn = document.getElementById('generateBtn');
const studyCountEl = document.getElementById('studyCount');
const countPlus = document.getElementById('countPlus');
const countMinus = document.getElementById('countMinus');

let isGenerated = false;
let studyCount = 0;

/* URL helpers */
const encode = encodeURIComponent;
const decode = t => decodeURIComponent(t || '');

function updateURL() {
    history.replaceState(
        null,
        '',
        `?abbr=${encode(abbrInput.value)}&full=${encode(fullInput.value)}&count=${studyCount}`
    );
}

/* load from URL */
window.addEventListener('DOMContentLoaded', () => {
    const p = new URLSearchParams(location.search);
    abbrInput.value = decode(p.get('abbr'));
    fullInput.value = decode(p.get('full'));
    studyCount = parseInt(p.get('count')) || 0;
    studyCountEl.textContent = studyCount;
});

/* generate */
function generateTool() {
    const abbrLines = abbrInput.value.split('\n');
    const fullLines = fullInput.value.split('\n');

    if (abbrLines.length !== fullLines.length) {
        alert("Line counts must match!");
        return;
    }

    updateURL();
    abbreviationText.innerHTML = '';

    abbrLines.forEach((abbr, i) => {
        const line = document.createElement('div');
        line.className = 'line';

        const a = document.createElement('span');
        a.className = 'abbr-line';
        a.textContent = abbr;

        const f = document.createElement('div');
        f.className = 'full-form-line';

        if (fullLines[i].trim() === '') {
            f.dataset.empty = "true";
        } else {
            f.textContent = fullLines[i];
        }

        line.append(a, f);

        line.onclick = () => {
            if (!f.dataset.empty) {
                f.classList.toggle('show');
            }
        };

        abbreviationText.appendChild(line);
    });

    isGenerated = true;
}

generateBtn.onclick = generateTool;

/* SPACE = reveal next smoothly */
document.addEventListener('keydown', e => {
    if (e.key === ' ' && e.target.tagName !== 'TEXTAREA') {
        e.preventDefault();

        if (!isGenerated) {
            generateTool();
            return;
        }

        const nextHidden = [...document.querySelectorAll('.full-form-line')]
            .find(el =>
                el.dataset.empty !== "true" &&
                !el.classList.contains('show')
            );

        if (nextHidden) {
            nextHidden.classList.add('show');
            nextHidden.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
    }
});

/* CTRL+1 toggle all */
document.addEventListener('keydown', e => {
    if (e.ctrlKey && e.key === '1') {
        e.preventDefault();

        const all = [...document.querySelectorAll('.full-form-line')]
            .filter(el => el.dataset.empty !== "true");

        const anyVisible = all.some(el => el.classList.contains('show'));
        all.forEach(el =>
            el.classList.toggle('show', !anyVisible)
        );
    }
});

/* study count */
countPlus.onclick = () => {
    studyCount++;
    studyCountEl.textContent = studyCount;
    updateURL();
};

countMinus.onclick = () => {
    if (studyCount > 0) {
        studyCount--;
        studyCountEl.textContent = studyCount;
        updateURL();
    }
};

/* tab as spaces */
function enableTabAsSpaces(el, spaces = 4) {
    el.addEventListener('keydown', e => {
        if (e.key === 'Tab') {
            e.preventDefault();
            const s = el.selectionStart;
            el.value =
                el.value.slice(0, s) +
                ' '.repeat(spaces) +
                el.value.slice(el.selectionEnd);
            el.selectionStart = el.selectionEnd = s + spaces;
        }
    });
}
enableTabAsSpaces(abbrInput);
enableTabAsSpaces(fullInput);
</script>
</body>
</html>
